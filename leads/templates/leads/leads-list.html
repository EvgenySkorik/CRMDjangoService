{% extends "_base.html" %}

{% block content %}
<h2 class="fw-bold">Лиды</h2>
<div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
    <div class="hstack gap-3 pb-4">
        <a href="{% url 'leads:create' %}" class="btn btn-success p-2">Создать</a>
    </div>
    <div class="col">
        <ul class="list-group">
            {% for lead in leads %}
            <li class="list-group-item list-group-item-light d-flex justify-content-between">
                <a href="{% url 'leads:detail' pk=lead.pk %}" class="text-decoration-none link-dark">{{ lead.last_name }} {{ lead.first_name }} {{ lead.middle_name }}</a>

                <div>
                    <a href="{% url 'customers:create_from_lead' lead.pk %}" class="btn btn-success">Активировать</a>
                    <a href="{% url 'leads:delete' pk=lead.pk %}" class="btn btn-danger">Удалить</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
