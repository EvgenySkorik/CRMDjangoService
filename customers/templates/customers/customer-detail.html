{% extends "_base.html" %}

{% block content %}
<h2 class="fw-bold">Детальная информация об активном клиенте</h2>
<div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
    <div class="col"></div>
    <div class="col">
        <div class="card border-dark shadow" style="background: #eee">
            <div class="card-body">
                <h5 class="card-title fw-bold">{{ customer.lead.last_name }} {{ customer.lead.first_name }}</h5>
                <p class="card-text">{{ customer.lead.telephone }}</p>
                <p class="card-text">{{ customer.lead.email }}</p>
                <p class="card-text">{{ customer.lead.campaign.name }}</p>
                <div class="d-flex justify-content-center fw-bold">
                    <a href="{% url 'customers:update' pk=customer.pk %}" class="btn btn-primary">Редактировать</a>
                    <a href="{% url 'customers:delete' pk=customer.pk %}" class="btn btn-danger">Удалить</a>
                </div>
            </div>
        </div>
    </div>
    <div class="col"></div>
</div>
{% endblock %}
