{% extends "base.html" %}

{% block title %}{{ service.name }}{% endblock %}

{% block content %}
<div class="card">
    <div class="flex-between mb-20">
        <h2>{{ service.name }}</h2>
        <div>
            <a href="{% url 'services:update' service.pk %}" class="btn">✏️ Редактировать</a>
            <a href="{% url 'services:delete' service.pk %}" class="btn btn-danger">🗑️ Удалить</a>
        </div>
    </div>

    <table>
        <tr>
            <th style="width: 150px;">Название</th>
            <td>{{ service.name }}</td>
        </tr>
        <tr>
            <th>Описание</th>
            <td>{{ service.description|linebreaks|default:"—" }}</td>
        </tr>
        <tr>
            <th>Стоимость</th>
            <td>{{ service.price }} ₽</td>
        </tr>
    </table>

    <div class="mt-20">
        <a href="{% url 'services:list' %}">← Назад к списку</a>
    </div>
</div>
{% endblock %}
